<!DOCTYPE html>
<html>
<head>
    <title>AMU Chat App</title>
    <style>
        body { background: url("{{ url_for('static', filename='images.jpg') }}") no-repeat center center fixed; background-size: cover; font-family: sans-serif; margin: 0; }
        .header { background: #004d40; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .chat-box { width: 400px; height: 500px; background: rgba(255,255,255,0.9); margin: 20px auto; border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; }
        .input-area { padding: 15px; border-top: 1px solid #ddd; }
        input[type="text"] { width: 80%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 10px; background: #004d40; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .admin-btn { background: #ff9800; color: white; padding: 8px; text-decoration: none; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <strong>AMU Lab Technical Assistance</strong><br>
            <small>Cloud Chat App</small>
        </div>
        <div>
            {% if session['username'] == 'admin' %}
                <a href="{{ url_for('register') }}" class="admin-btn">Register User</a>
            {% endif %}
            <a href="{{ url_for('logout') }}" style="color:white; margin-left: 10px;">Logout</a>
        </div>
    </div>

    <div class="chat-box">
        <div class="messages">
            {% for msg in messages %}
                <p><strong>{{ msg.sender }}:</strong> {{ msg.content }}</p>
            {% endfor %}
        </div>
        <div class="input-area">
            <form action="{{ url_for('send') }}" method="POST">
                <input type="text" name="content" placeholder="Type your message..." required>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>
</body>
</html>
