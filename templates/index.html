<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud Chat App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; }
        .chat-container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 12px; border: none; width: 100%; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .message-list { margin-top: 25px; border-top: 2px solid #eee; padding-top: 15px; max-height: 400px; overflow-y: auto; }
        .msg { background: #f8f9fa; padding: 12px; margin-bottom: 10px; border-radius: 10px; border-left: 5px solid #007bff; color: #333; }
        strong { color: #0056b3; display: block; margin-bottom: 3px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Cloud Chat</h2>
        <form id="chatForm" action="/send" method="POST">
            <input type="text" id="username" name="name" placeholder="Enter Your Name" required>
            <textarea name="content" placeholder="Write a message..." required></textarea>
            <button type="submit">Send Message</button>
        </form>

        <div class="message-list">
            <h3>Recent Messages</h3>
            {% for message in messages %}
                <div class="msg">
                    <strong>{{ message.name }}</strong>
                    {{ message.content }}
                </div>
            {% endfor %}
        </div>
    </div>

    <script>
        // ስሙን በብሮውዘሩ ሜሞሪ ውስጥ ሴቭ አድርጎ እንዲይዘው ማድረግ
        const nameInput = document.getElementById('username');
        const savedName = localStorage.getItem('chatUsername');

        if (savedName) {
            nameInput.value = savedName;
        }

        document.getElementById('chatForm').addEventListener('submit', function() {
            localStorage.setItem('chatUsername', nameInput.value);
        });
    </script>
</body>
</html>
