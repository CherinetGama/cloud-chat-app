<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat App</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; color: #333; }
        .chat-box { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, textarea { width: 95%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #28a745; color: white; padding: 10px; border: none; width: 100%; cursor: pointer; border-radius: 5px; }
        .message-list { margin-top: 20px; border-top: 2px solid #eee; padding-top: 10px; }
        .msg { background: #e9ecef; padding: 10px; margin-bottom: 5px; border-radius: 5px; color: black !important; }
    </style>
</head>
<body>
    <div class="chat-box">
        <h2>Cloud Chat</h2>
        <form action="/send" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <textarea name="content" placeholder="Message" required></textarea>
            <button type="submit">Send</button>
        </form>

        <div class="message-list">
            <h3>Recent Messages</h3>
            {% for message in messages %}
                <div class="msg">
                    <strong>{{ message.name }}:</strong> {{ message.content }}
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
