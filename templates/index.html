<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud Chat App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e5ddd5; padding: 20px; }
        .chat-container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; height: 90vh; display: flex; flex-direction: column; }
        h2 { text-align: center; color: #075e54; margin-top: 0; }
        
        .message-list { flex-grow: 1; overflow-y: auto; padding: 10px; background-color: #e5ddd5; border-radius: 10px; margin-bottom: 15px; display: flex; flex-direction: column; }
        
        /* መልእክቶቹን በግራና በቀኝ የማድረጊያ ስታይል */
        .msg { max-width: 75%; padding: 10px; margin-bottom: 8px; border-radius: 10px; position: relative; font-size: 14px; line-height: 1.4; }
        
        /* የሌሎች መልእክት (በግራ) */
        .other { align-self: flex-start; background-color: white; color: black; border-bottom-left-radius: 0; }
        
        /* ያንተ መልእክት (በቀኝ) */
        .me { align-self: flex-end; background-color: #dcf8c6; color: black; border-bottom-right-radius: 0; text-align: right; }
        
        strong { display: block; font-size: 12px; color: #075e54; margin-bottom: 2px; }
        
        .input-area { background: #f0f0f0; padding: 10px; border-radius: 10px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #075e54; color: white; padding: 10px; border: none; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="chat-container">
        <h2>Cloud Chat</h2>
        
        <div class="message-list" id="messageList">
            {% for message in messages %}
                <div class="msg {% if message.name.lower() == 'cherinet gama' %}me{% else %}other{% endif %}">
                    <strong>{{ message.name }}</strong>
                    {{ message.content }}
                </div>
            {% endfor %}
        </div>

        <div class="input-area">
            <form id="chatForm" action="/send" method="POST">
                <input type="text" id="username" name="name" placeholder="Your Name" required>
                <textarea name="content" placeholder="Type a message..." required></textarea>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        // ስምህን ሴቭ አድርጎ እንዲይዘው
        const nameInput = document.getElementById('username');
        if (localStorage.getItem('chatUsername')) {
            nameInput.value = localStorage.getItem('chatUsername');
        }
        document.getElementById('chatForm').addEventListener('submit', function() {
            localStorage.setItem('chatUsername', nameInput.value);
        });

        // ገጹ ሲከፈት ሁልጊዜ ወደ ታችኛው መልእክት እንዲወርድ
        const msgList = document.getElementById('messageList');
        msgList.scrollTop = msgList.scrollHeight;
    </script>
</body>
</html>
