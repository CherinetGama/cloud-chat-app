<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMU Lab Chat</title>
    <style>
        body {
            background: url("{{ url_for('static', filename='image_288f4a.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-card {
            background: rgba(255, 255, 255, 0.95);
            width: 500px;
            height: 600px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .header {
            background-color: #005a4e;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f0f2f5;
        }
        .input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }
        textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .send-btn {
            width: 100%;
            padding: 10px;
            background: #005a4e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .logout-btn {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="chat-card">
        <div class="header">
            <div>
                <strong>AMU Lab Technical Assistance</strong><br>
                <small>Cloud Chat App</small>
            </div>
            <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
        </div>
        
        <div class="messages-area">
            {% for msg in messages %}
                <div style="margin-bottom: 15px;">
                    <strong>{{ msg.name }}:</strong> {{ msg.content }}
                    {% if msg.file_url %}
                        <br><a href="{{ url_for('static', filename='uploads/' + msg.file_url) }}" target="_blank">View File</a>
                    {% endif %}
                </div>
            {% endfor %}
        </div>

        <form class="input-area" action="/send" method="POST" enctype="multipart/form-data">
            <select name="receiver">
                <option value="Public">Everyone (Public Chat)</option>
                {% for user in all_users %}
                    <option value="{{ user.username }}">{{ user.username }}</option>
                {% endfor %}
            </select>
            <textarea name="content" placeholder="Type your message..."></textarea>
            <input type="file" name="file" style="margin-bottom: 10px;">
            <button type="submit" class="send-btn">Send Message</button>
        </form>
    </div>
</body>
</html>
