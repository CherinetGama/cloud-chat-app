<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud RDBMS Chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #333; text-align: center; }
        .chat-box { height: 300px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; margin-bottom: 20px; background: #fafafa; border-radius: 5px; }
        .msg { margin-bottom: 10px; padding: 8px; border-radius: 5px; background: #e9ecef; }
        .msg strong { color: #007bff; }
        input[type="text"] { width: calc(100% - 22px); padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Family Chat (Cloud)</h2>
        <div class="chat-box">
            {% for msg in messages %}
                <div class="msg">
                    <strong>{{ msg[1] }}:</strong> {{ msg[2] }}
                </div>
            {% endfor %}
        </div>
        <form action="/send" method="POST">
            <input type="text" name="user" placeholder="ስም" required>
            <input type="text" name="content" placeholder="መልእክት..." required>
            <button type="submit">ላክ</button>
        </form>
    </div>
</body>
</html>
