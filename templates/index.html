<!DOCTYPE html>
<html>
<head>
    <title>Cloud Chat App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f0f2f5; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #1c1e21; }
        form { margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        ul { list-style-type: none; padding: 0; }
        li { background: #e9ecef; margin: 10px 0; padding: 15px; border-radius: 8px; color: #333; border-left: 5px solid #007bff; }
        strong { color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloud Chat App</h1>
        <form action="/send" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <textarea name="content" placeholder="Your Message" required></textarea>
            <button type="submit">Send</button>
        </form>

        <h2>Messages</h2>
        <ul>
            {% for message in messages %}
            <li>
                <strong>{{ message.name }}:</strong> {{ message.content }}
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
