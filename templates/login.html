<!DOCTYPE html>
<html>
<head>
    <title>Login - AMU Lab Technical Assistance</title>
    <style>
        body { 
            background: url("{{ url_for('static', filename='images.jpg') }}") no-repeat center center fixed; 
            background-size: cover; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* የዩኒቨርሲቲው ስም ማሳያ የላይኛው ጽሑፍ ዲዛይን */
        .app-title-container {
            text-align: center;
            margin-bottom: 25px;
            background: rgba(0, 77, 64, 0.9); /* ጥቁር አረንጓዴ ከጀርባው */
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            border-bottom: 4px solid #ff9800; /* ብርቱካናማ መስመር */
            max-width: 450px;
        }
        .app-title-container h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }
        .app-title-container p {
            color: #e0f2f1;
            margin: 5px 0 0 0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* የመግቢያ ሳጥን ዲዛይን */
        .container { 
            background: rgba(255, 255, 255, 0.92); 
            padding: 35px 30px; 
            border-radius: 15px; 
            text-align: center; 
            width: 340px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            transition: all 0.3s ease;
        }
        .container h2 {
            color: #004d40;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        input { 
            width: 90%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 25px; 
            border: 1px solid #ccc; 
            font-size: 14px;
            outline: none;
            text-align: center;
            transition: border 0.3s;
        }
        input:focus {
            border: 2px solid #004d40;
        }
        button { 
            width: 98%; 
            padding: 12px; 
            background: #004d40; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,77,64,0.3);
            transition: background 0.3s;
        }
        button:hover {
            background: #00796b;
        }
        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 8px;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="app-title-container">
        <h1>Arba Minch University</h1>
        <p>LAB Technical Assistance Online Chat Application</p>
    </div>

    <div class="container">
        <h2>Account Login</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for m in messages %}
                    <div class="error-msg">{{ m }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
