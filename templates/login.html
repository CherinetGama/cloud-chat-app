<!DOCTYPE html>
<html>
<head>
    <title>Login - AMU Chat</title>
    <style>
        body {
            background: url("{{ url_for('static', filename='images.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif;
        }
        .container { background: rgba(255,255,255,0.9); padding: 30px; border-radius: 10px; text-align: center; width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { width: 95%; padding: 10px; background: #005a4e; color: white; border: none; border-radius: 5px; cursor: pointer; }
        a { color: #005a4e; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color:#005a4e">Login</h2>
        {% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<p style="color:red">{{m}}</p>{% endfor %}{% endif %}{% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>አዲስ ነህ? <a href="{{ url_for('register') }}">እዚህ ተመዝገብ</a></p>
    </div>
</body>
</html>
