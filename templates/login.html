<!DOCTYPE html>
<html>
<head>
    <title>Login - AMU Lab Technical Assistance</title>
    <style>
        body { 
            background: url("{{ url_for('static', filename='images.jpg') }}") no-repeat center center fixed; 
            background-size: cover; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* አናት ላይ ያለው የዩኒቨርሲቲው ስም ማሳያ ሳጥን - አሁን የጀርባው ምስል በከፊል ይታያል (Transparent) */
        .app-title-container {
            text-align: center;
            margin-bottom: 20px;
            /* rgba ላይ የመጨረሻዋ 0.72 ሳጥኑ በጥቂቱ ግልጽ ሆኖ የጀርባው ምስል እንዲታይ ታደርጋለች */
            background: rgba(0, 77, 64, 0.72); 
            backdrop-filter: blur(6px); /* በሳጥኑ ውስጥ የሚያልፈው ምስል ላይ ያማረ የብዥታ ጥላ ይሰጣል */
            -webkit-backdrop-filter: blur(6px);
            padding: 18px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border-bottom: 4px solid #ff9800; /* ወርቃማ መስመር */
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ክብ ቅርጽ ያለው የሎጎ ማሳያ */
        .logo-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            background: #ffffff;
        }

        .app-title-container h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
        }
        .app-title-container p {
            color: #e0f2f1;
            margin: 0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }

        /* የፎርሙ ሳጥን ዲዛይን - እሱም የጀርባው ምስል በጥቂቱ እንዲታይ ተደርጓል */
        .container { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 35px 30px; 
            border-radius: 18px; 
            text-align: center; 
            width: 340px; 
            box-shadow: 0 12px 35px rgba(0,0,0,0.35); 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .container h2 {
            color: #004d40;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 23px;
            font-weight: bold;
        }
        input { 
            width: 90%; 
            padding: 13px; 
            margin: 10px 0; 
            border-radius: 25px; 
            border: 1px solid #ccc; 
            font-size: 14px;
            outline: none;
            text-align: center;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        input:focus {
            border: 2px solid #004d40;
            box-shadow: 0 0 8px rgba(0, 77, 64, 0.35);
        }
        button { 
            width: 98%; 
            padding: 13px; 
            background: #004d40; 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,77,64,0.4);
            transition: all 0.3s;
        }
        button:hover {
            background: #00796b;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0,77,64,0.5);
        }
        .error-msg {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px;
            border-radius: 25px;
            font-size: 13px;
            margin-bottom: 15px;
            font-weight: 500;
            border: 1px solid #ffcdd2;
        }
    </style>
</head>
<body>

    <div class="app-title-container">
        <img src="{{ url_for('static', filename='image_27f9e4.png') }}" class="logo-img" alt="AMU Logo">
        <h1>Arba Minch University</h1>
        <p>LAB Technical Assistance Online Chat Application</p>
    </div>

    <div class="container">
        <h2>Account Login</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for m in messages %}
                    <div class="error-msg">{{ m }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
